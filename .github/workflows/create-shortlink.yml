name: Create LWAI shortlink

on:
  push:
    branches:
      - ops/shortlink-create

jobs:
  create-shortlink:
    runs-on: ubuntu-latest
    steps:
      - name: Create and verify stable TinyURL
        shell: bash
        run: |
          set -euo pipefail
          TARGET='https://raw.githubusercontent.com/jake6956/LastWar-Account_Audit_Engine/main/engine/BOOTSTRAP.txt'
          SHORT_URL="$(curl -fsS --get --data-urlencode "url=${TARGET}" 'https://tinyurl.com/api-create.php')"
          echo "SHORT_URL=${SHORT_URL}"
          effective="$(curl -LsS -o /dev/null -w '%{url_effective}' "${SHORT_URL}")"
          echo "EFFECTIVE_URL=${effective}"
          [[ "${effective}" == "${TARGET}" ]]
