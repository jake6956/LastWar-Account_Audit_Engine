name: Validate LWAI Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tree
        run: python scripts/validate_release.py
      - name: Run runtime behavioral regressions
        working-directory: tests
        run: python -m unittest -v test_runtime_behavior.py test_update_command_contract.py test_auto_update_controller.py test_user_experience_contract.py
