name: Validate LWAI Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tree
        run: python scripts/validate_release.py
      - name: Run runtime behavioral regressions
        working-directory: tests
        run: python -m unittest -v test_runtime_behavior.py test_update_command_contract.py test_auto_update_controller.py test_user_experience_contract.py test_season_intelligence_contract.py
      - name: Verify live one-line installer
        shell: bash
        run: |
          set -euo pipefail
          alias_url='https://tinyurl.com/2yxf7f5x'
          canonical='https://raw.githubusercontent.com/jake6956/LastWar-Account_Audit_Engine/main/engine/BOOTSTRAP.txt'
          effective="$(curl -Ls -o /tmp/alias-bootstrap.txt -w '%{url_effective}' "$alias_url")"
          test "$effective" = "$canonical"
          curl -Ls "$canonical" -o /tmp/canonical-bootstrap.txt
          cmp /tmp/alias-bootstrap.txt /tmp/canonical-bootstrap.txt
          grep -F 'engine_version: 2026-08-29.20' /tmp/canonical-bootstrap.txt
          grep -F 'SANITIZED: YES' /tmp/canonical-bootstrap.txt
          grep -F 'ACCOUNT STATE INCLUDED: NO' /tmp/canonical-bootstrap.txt
          grep -F 'domain.season-intelligence' /tmp/canonical-bootstrap.txt
          grep -Fi 'seed/missing knowledge triggers due diligence' /tmp/canonical-bootstrap.txt
          grep -F 'refresh season knowledge' /tmp/canonical-bootstrap.txt
          grep -F 'force canonical ENGINE update preserving LOCAL STATE' /tmp/canonical-bootstrap.txt
