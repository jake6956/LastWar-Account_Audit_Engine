name: Validate LWAI Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tree
        run: python scripts/validate_release.py
      - name: Run runtime behavioral regressions
        working-directory: tests
        run: python -m unittest -v test_runtime_behavior.py
      - name: Verify live one-line installer
        shell: bash
        run: |
          set -euo pipefail
          alias_url='https://tinyurl.com/2yxf7f5x'
          canonical='https://raw.githubusercontent.com/jake6956/LastWar-Account_Audit_Engine/main/engine/BOOTSTRAP.txt'
          resolved="$(curl -fsSL -o /tmp/lwai-bootstrap.txt -w '%{url_effective}' "$alias_url")"
          test "$resolved" = "$canonical"
          curl -fsSL "$canonical" -o /tmp/lwai-canonical.txt
          cmp /tmp/lwai-bootstrap.txt /tmp/lwai-canonical.txt
          grep -Fx 'engine_version: 2026-08-29.13' /tmp/lwai-bootstrap.txt
          grep -Fx 'engine_api_version: 1.0' /tmp/lwai-bootstrap.txt
          grep -Fx 'SANITIZED: YES' /tmp/lwai-bootstrap.txt
          grep -Fx 'ACCOUNT STATE INCLUDED: NO' /tmp/lwai-bootstrap.txt
          grep -F 'If no Workspace Registry exists but legacy single-account LWAI state exists' /tmp/lwai-bootstrap.txt
