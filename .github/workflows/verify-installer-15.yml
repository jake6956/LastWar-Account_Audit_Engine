name: Verify LWAI Installer 2026-08-29.15

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Verify stable alias and canonical loader
        shell: bash
        run: |
          set -euo pipefail
          ALIAS='https://tinyurl.com/2yxf7f5x'
          EXPECTED='https://raw.githubusercontent.com/jake6956/LastWar-Account_Audit_Engine/main/engine/BOOTSTRAP.txt'

          FINAL=$(curl -sS -L -o /tmp/alias-loader -w '%{url_effective}' "$ALIAS")
          echo "alias_final=$FINAL"
          test "$FINAL" = "$EXPECTED"

          curl -fsSL "$EXPECTED" -o /tmp/direct-loader
          cmp /tmp/alias-loader /tmp/direct-loader
          grep -q '^engine_version: 2026-08-29.15$' /tmp/alias-loader
          grep -q '^engine_api_version: 1.0$' /tmp/alias-loader
          grep -q '^SANITIZED: YES$' /tmp/alias-loader
          grep -q '^ACCOUNT STATE INCLUDED: NO$' /tmp/alias-loader
          grep -q 'PRODUCTION IDENTITY / ALIAS CANONICALIZATION' /tmp/alias-loader

      - name: Probe cache-buster passthrough
        shell: bash
        run: |
          set -euo pipefail
          ALIAS="https://tinyurl.com/2yxf7f5x?lwai_cb=${GITHUB_RUN_ID}"
          FINAL=$(curl -sS -L -o /tmp/alias-cb -w '%{url_effective}' "$ALIAS")
          echo "cachebuster_final=$FINAL"
          head -n 7 /tmp/alias-cb
          grep -q '^engine_version: 2026-08-29.15$' /tmp/alias-cb
